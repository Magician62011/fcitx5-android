name: build-rime-plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Build simplehttp.so for Android arm64-v8a by calling the reusable
  # workflow in librime-cloud. This eliminates the manual copy step.
  build-simplehttp:
    uses: Magician62011/librime-cloud/.github/workflows/build-android.yml@android-simplehttp

  build:
    needs: build-simplehttp
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache the prebuilt submodule by its commit hash to avoid re-downloading
    # the large binary tree on every run.
    - name: Get prebuilt submodule commit
      id: prebuilt-commit
      run: |
        echo "sha=$(git ls-tree HEAD lib/fcitx5/src/main/cpp/prebuilt | awk '{print $3}')" >> $GITHUB_OUTPUT

    - name: Cache prebuilt (arm64-v8a)
      uses: actions/cache@v4
      id: cache-prebuilt
      with:
        path: |
          lib/fcitx5/src/main/cpp/prebuilt
          .git/modules/lib/fcitx5/src/main/cpp/prebuilt
        key: prebuilt-arm64-v8a-${{ steps.prebuilt-commit.outputs.sha }}

    - name: Init prebuilt submodule (shallow, trim to arm64-v8a)
      if: steps.cache-prebuilt.outputs.cache-hit != 'true'
      run: |
        git submodule update --init --depth 1 lib/fcitx5/src/main/cpp/prebuilt
        cd lib/fcitx5/src/main/cpp/prebuilt
        find . -mindepth 2 -maxdepth 2 -type d \
          \( -name "armeabi-v7a" -o -name "x86" -o -name "x86_64" \) \
          -exec rm -rf {} + 2>/dev/null || true

    - name: Init source submodules
      run: |
        git submodule update --init --depth 1 lib/fcitx5/src/main/cpp/fcitx5
        git submodule update --init --depth 1 plugin/rime/src/main/cpp/fcitx5-rime
        git submodule update --init --depth 1 plugin/rime/src/main/cpp/rime-prelude
        git submodule update --init --depth 1 plugin/rime/src/main/cpp/rime-essay
        git submodule update --init --depth 1 plugin/rime/src/main/cpp/rime-luna-pinyin
        git submodule update --init --depth 1 plugin/rime/src/main/cpp/rime-stroke

    # Download the freshly built simplehttp.so from the build-simplehttp job
    # and place it into the plugin assets — no manual copy needed.
    - name: Download simplehttp artifact
      uses: actions/download-artifact@v4
      with:
        name: android-arm64-v8a
        path: /tmp/simplehttp-artifact

    - name: Install simplehttp.so and iconv.so into plugin assets
      run: |
        tar xf /tmp/simplehttp-artifact/android-arm64-v8a-lua5.4.tar.gz \
            -C /tmp/simplehttp-artifact/
        cp /tmp/simplehttp-artifact/out-android/simplehttp.so \
            plugin/rime/src/main/assets/usr/share/lua/5.4/simplehttp.so
        cp /tmp/simplehttp-artifact/out-android/iconv.so \
            plugin/rime/src/main/assets/usr/share/lua/5.4/iconv.so
        echo "simplehttp.so: $(wc -c < plugin/rime/src/main/assets/usr/share/lua/5.4/simplehttp.so) bytes"
        echo "iconv.so:      $(wc -c < plugin/rime/src/main/assets/usr/share/lua/5.4/iconv.so) bytes"

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android environment
      uses: android-actions/setup-android@v3

    - name: Install CMake and NDK
      run: sdkmanager --install "cmake;3.31.6" "ndk;28.0.13004108"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install extra-cmake-modules gettext

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Generate test signing key
      run: |
        keytool -genkeypair -v \
          -keystore test.keystore \
          -alias testkey \
          -keyalg RSA -keysize 2048 \
          -validity 3650 \
          -storepass testpass \
          -keypass testpass \
          -dname "CN=Test"
        echo "SIGN_KEY_BASE64=$(base64 -w 0 test.keystore)" >> $GITHUB_ENV

    - name: Build RIME plugin release APK (arm64-v8a)
      env:
        BUILD_ABI: arm64-v8a
        SIGN_KEY_PWD: testpass
        SIGN_KEY_ALIAS: testkey
      run: ./gradlew :plugin:rime:assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: rime-plugin-release-arm64
        path: plugin/rime/build/outputs/apk/release/*.apk
